name: Build PS2

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PS2DEV: /usr/local/ps2dev
      PS2SDK: /usr/local/ps2dev/ps2sdk
      PS2SDKSRC: /usr/local/ps2dev/ps2sdk/src

    steps:
      # 在宿主机上 checkout，git 版本足够新，submodules 正常
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 编译时进入 ps2dev 容器执行 make
      - name: Build inside ps2dev container
        uses: docker://ps2dev/ps2dev:latest
        with:
          args: sh -c "make clean || true && make -j$(nproc)"
        env:
          PS2DEV: /usr/local/ps2dev
          PS2SDK: /usr/local/ps2dev/ps2sdk
          PS2SDKSRC: /usr/local/ps2dev/ps2sdk/src

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNESticleRevive-PS2
          path: |
            *.elf
            *.iso