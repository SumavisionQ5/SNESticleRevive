name: Build PS2

on:
  push:
    branches: [ with_picodrive ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build
        run: make AUTO_INSTALL=yes

      - name: List build outputs
        run: ls -la build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNESticleRevive-PS2
          path: build/*.elf
          if-no-files-found: error
